plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'ru.privatenull'
version = '1.0.0'

base {
    archivesName = 'pnTrades'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def pnLibraryVersion = '0.0.1-dev.6'

dependencies {
    implementation "io.github.pnfolder:pnlibrary-bootstrap-bukkit:${pnLibraryVersion}"
    compileOnly "io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}"
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
}

def targetJavaVersion = 17
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate('com.google.gson', 'ru.privatenull.libs.gson')
    relocate('org.pnfolder.pnlibrary.bootstrap', 'ru.privatenull.libs.pnbootstrap')
    relocate('org.pnfolder.pnlibrary.bukkit.bootstrap', 'ru.privatenull.libs.pnbootstrap.bukkit')
    relocate('org.pnfolder.pnlibrary.console', 'ru.privatenull.libs.pnbootstrap.console')
}

tasks.jar {
    archiveClassifier.set('plain')
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}

tasks.build {
    dependsOn tasks.shadowJar
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
